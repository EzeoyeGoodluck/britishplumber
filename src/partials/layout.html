<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{name}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#010d1d">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Plumber",
    "name": "{{name}}",
    "url": "{{url}}",
    "telephone": ["{{phoneTel}}", "{{landlineTel}}"],
    "email": "{{email}}",
    "image": "{{ogImage}}",
    "address": { "@type": "PostalAddress", "addressLocality": "{{locality}}", "addressRegion": "{{region}}", "postalCode": "{{postcode}}", "addressCountry": "GB" },
    "areaServed": "Dorset",
    "openingHoursSpecification": { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], "opens": "00:00", "closes": "23:59" }
  }
  </script>
</head>
<body class="theme">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="mh">
    <div class="mh-inner">
      <a class="mh-logo" href="/" aria-label="{{name}} home">
        <img src="{{img_logo}}" alt="" width="56" height="56">
        <span>The British Plumber</span>
      </a>
      <nav class="mh-nav" id="main-nav" aria-label="Main">
        <ul>{{navItems}}</ul>
      </nav>
      <a class="mh-call" href="{{telHref}}">
        <span class="mh-call-label">24/7 emergency line</span>
        <span class="mh-call-num">{{phone}}</span>
      </a>
      <button class="nav-toggle mh-toggle" aria-label="Menu" aria-expanded="false" aria-controls="main-nav"><span></span></button>
    </div>
  </header>

  <main id="main">
{{content}}
  </main>

  {{> site-footer}}
  <script>document.querySelector('[data-year]').textContent = new Date().getFullYear();</script>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
